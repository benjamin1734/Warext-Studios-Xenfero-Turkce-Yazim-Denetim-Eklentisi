name: Warext Yerel Kalite Doğrulama

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warext-local-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Tamamen yerel kalite ve paket doğrulaması
        shell: bash
        run: bash tools/build_release.sh
