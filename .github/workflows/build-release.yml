name: Warext XenForo Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Yerel motoru doğrula ve XenForo paketini üret
        shell: bash
        run: bash tools/build_release.sh

      - name: Sürüm bilgisini doğrula
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('upload/src/addons/Warext/TurkishSpellCheck/addon.json').read_text(encoding='utf-8'))
          print(data['version_string'])
          PY
          )"
          PACKAGE="Warext-Turkce-Yazim-Denetimi-V${VERSION}-XenForo.zip"
          test -f "$PACKAGE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Kurulum paketini artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Warext-Turkce-Yazim-Denetimi-V${{ steps.meta.outputs.version }}-XenForo
          path: ${{ steps.meta.outputs.package }}
          if-no-files-found: error
          retention-days: 90

      - name: Doğrulanmış paketi main dalına kaydet
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "V${{ steps.meta.outputs.version }}"
            git push
          fi

      - name: GitHub Release oluştur veya güncelle
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          TAG="V${VERSION}"
          git fetch origin main
          TARGET="$(git rev-parse origin/main)"
          python3 - <<'PY' > /tmp/warext-release-notes.md
          import json
          from pathlib import Path

          addon = json.loads(Path('upload/src/addons/Warext/TurkishSpellCheck/addon.json').read_text(encoding='utf-8'))
          version = addon['version_string']
          package = f"Warext-Turkce-Yazim-Denetimi-V{version}-XenForo.zip"
          changelog = Path('upload/src/addons/Warext/TurkishSpellCheck/CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          heading = f"## V{version}"
          notes = []
          active = False
          for line in changelog:
              if line.strip() == heading:
                  active = True
                  continue
              if active and line.startswith('## '):
                  break
              if active and line.strip():
                  notes.append(line.rstrip())

          print(f"# Warext Studios | Türkçe Yazım Denetimi V{version}")
          print()
          print("XenForo 2.3+ için tamamen yerel çalışan doğrudan kurulabilir kararlı paket.")
          print()
          if notes:
              print("## Bu sürümde")
              print()
              print('\n'.join(notes))
              print()
          print("## Kurulum")
          print()
          print(f"Release altındaki **{package}** dosyasını indirin ve XenForo ACP → Add-ons → Install/upgrade from archive alanından yükleyin.")
          print()
          print("Çalışma zamanında harici API, bulut modeli veya uzak NLP servisi kullanılmaz.")
          print()
          print("---")
          print()
          print("## English")
          print()
          print(f"# Warext Studios | Turkish Writing Checker V{version}")
          print()
          print("A fully local, directly installable stable package for XenForo 2.3+.")
          print()
          if version == '1.0.6':
              print("## In this release")
              print()
              english_notes = [
                  "- Added the V3.1.3 adaptive performance protection layer.",
                  "- Prevented heavy synchronous analysis of the entire document on every keystroke in long texts.",
                  "- While the user is typing, only a limited analysis window around the changed region is processed.",
                  "- When typing stops for 2.4 seconds, a deeper document analysis runs while still respecting time and window budgets.",
                  "- Long-text segments are limited to a maximum of 1,000 characters at runtime.",
                  "- On supported browsers, `navigator.scheduling.isInputPending()` defers heavy analysis while user input is waiting.",
                  "- For very long texts, a limited semantic backbone is built from distributed sentences to preserve the overall paragraph meaning.",
                  "- The number of document windows and analysis time processed on the main thread are budgeted.",
                  "- The COMPACT installation approach that downloaded the full package over the network was removed; the current release is distributed only as a self-contained full package.",
                  "- Added new performance telemetry and a regression contract.",
                  "- Synchronized the README, release-description generation, bug-report template and version texts with the current release.",
                  "- There is no external runtime NLP, API or model dependency."
              ]
              print('\n'.join(english_notes))
              print()
          print("## Installation")
          print()
          print(f"Download **{package}** from this release and upload it through XenForo ACP → Add-ons → Install/upgrade from archive.")
          print()
          print("No external API, cloud model or remote NLP service is used at runtime.")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/warext-release-notes.md
          else
            gh release create "$TAG" "$PACKAGE" --target "$TARGET" --title "$TAG" --notes-file /tmp/warext-release-notes.md
          fi
