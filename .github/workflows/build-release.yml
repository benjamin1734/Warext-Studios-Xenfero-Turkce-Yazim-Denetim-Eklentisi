name: Warext XenForo Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Yerel motoru doğrula ve XenForo paketini üret
        shell: bash
        run: bash tools/build_release.sh

      - name: Sürüm bilgisini doğrula
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('upload/src/addons/Warext/TurkishSpellCheck/addon.json').read_text(encoding='utf-8'))
          print(data['version_string'])
          PY
          )"
          PACKAGE="Warext-Turkce-Yazim-Denetimi-V${VERSION}-XenForo.zip"
          test -f "$PACKAGE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Kurulum paketini artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Warext-Turkce-Yazim-Denetimi-V${{ steps.meta.outputs.version }}-XenForo
          path: ${{ steps.meta.outputs.package }}
          if-no-files-found: error
          retention-days: 90

      - name: Doğrulanmış paketi main dalına kaydet
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "V${{ steps.meta.outputs.version }}"
            git push
          fi

      - name: GitHub Release oluştur veya güncelle
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          TAG="V${VERSION}"
          git fetch origin main
          TARGET="$(git rev-parse origin/main)"
          cat > /tmp/warext-release-notes.md <<EOF
          Warext Studios | Türkçe Yazım Denetimi ${TAG}

          XenForo 2.3+ için doğrudan kurulabilir doğrulanmış paket.

          Bu sürümde bağlama duyarlı yazım denetimi, morfolojik aday doğrulaması, yerel dil modeli sıralaması ve V3.1.2 regresyon kontrolleri bulunur.

          Kurulum: Release altındaki **${PACKAGE}** dosyasını indirin ve XenForo ACP → Add-ons → Install/upgrade from archive alanından yükleyin.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/warext-release-notes.md
          else
            gh release create "$TAG" "$PACKAGE" --target "$TARGET" --title "$TAG" --notes-file /tmp/warext-release-notes.md
          fi
