name: Warext XenForo Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Yerel motoru doğrula ve XenForo paketini üret
        shell: bash
        run: bash tools/build_release.sh

      - name: Sürüm bilgisini doğrula
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('upload/src/addons/Warext/TurkishSpellCheck/addon.json').read_text(encoding='utf-8'))
          print(data['version_string'])
          PY
          )"
          PACKAGE="Warext-Turkce-Yazim-Denetimi-V${VERSION}-XenForo.zip"
          test -f "$PACKAGE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Kurulum paketini artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Warext-Turkce-Yazim-Denetimi-V${{ steps.meta.outputs.version }}-XenForo
          path: ${{ steps.meta.outputs.package }}
          if-no-files-found: error
          retention-days: 90

      - name: Doğrulanmış paketi main dalına kaydet
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "V${{ steps.meta.outputs.version }}"
            git push
          fi

      - name: GitHub Release oluştur veya güncelle
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          TAG="V${VERSION}"
          git fetch origin main
          TARGET="$(git rev-parse origin/main)"
          python3 - <<'PY' > /tmp/warext-release-notes.md
          import json
          from pathlib import Path

          addon = json.loads(Path('upload/src/addons/Warext/TurkishSpellCheck/addon.json').read_text(encoding='utf-8'))
          version = addon['version_string']
          package = f"Warext-Turkce-Yazim-Denetimi-V{version}-XenForo.zip"
          changelog = Path('upload/src/addons/Warext/TurkishSpellCheck/CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          heading = f"## V{version}"
          notes = []
          active = False
          for line in changelog:
              if line.strip() == heading:
                  active = True
                  continue
              if active and line.startswith('## '):
                  break
              if active and line.strip():
                  notes.append(line.rstrip())

          print(f"# Warext Studios | Türkçe Yazım Denetimi V{version}")
          print()
          print("XenForo 2.3+ için tamamen yerel çalışan doğrudan kurulabilir kararlı paket.")
          print()
          if notes:
              print("## Bu sürümde")
              print()
              print('\n'.join(notes))
              print()
          print("## Kurulum")
          print()
          print(f"Release altındaki **{package}** dosyasını indirin ve XenForo ACP → Add-ons → Install/upgrade from archive alanından yükleyin.")
          print()
          print("Çalışma zamanında harici API, bulut modeli veya uzak NLP servisi kullanılmaz.")
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/warext-release-notes.md
          else
            gh release create "$TAG" "$PACKAGE" --target "$TARGET" --title "$TAG" --notes-file /tmp/warext-release-notes.md
          fi
