name: Bilingual Release Notes Update

on:
  workflow_run:
    workflows: ["Warext XenForo Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  update:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update V1.0.6 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='V1.0.6'
          gh release view "$TAG" >/dev/null
          gh release view "$TAG" --json body --jq .body > /tmp/current.md
          cat > /tmp/en.md <<'EOF'
# Warext Studios | Turkish Writing Checker V1.0.6

A fully local, directly installable stable package for XenForo 2.3+.

## In this release

- Added the V3.1.3 adaptive performance protection layer.
- Prevented heavy synchronous analysis of the entire document on every keystroke in long texts.
- While the user is typing, only a limited analysis window around the changed region is processed.
- When typing stops for 2.4 seconds, a deeper document analysis runs while still respecting time and window budgets.
- Long-text segments are limited to a maximum of 1,000 characters at runtime.
- On supported browsers, `navigator.scheduling.isInputPending()` defers heavy analysis while user input is waiting.
- For very long texts, a limited semantic backbone is built from distributed sentences to preserve the overall paragraph meaning.
- The number of document windows and analysis time processed on the main thread are budgeted.
- The COMPACT installation approach that downloaded the full package over the network was removed; the current release is distributed only as a self-contained full package.
- Added new performance telemetry and a regression contract.
- Synchronized the README, release-description generation, bug-report template and version texts with the current release.
- There is no external runtime NLP, API or model dependency.

## Installation

Download **Warext-Turkce-Yazim-Denetimi-V1.0.6-XenForo.zip** from this release and upload it through XenForo ACP → Add-ons → Install/upgrade from archive.

No external API, cloud model or remote NLP service is used at runtime.
EOF
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/current.md').read_text(encoding='utf-8').rstrip()
          marker = '\n\n---\n\n## English\n'
          if marker in base:
              base = base.split(marker, 1)[0].rstrip()
          en = Path('/tmp/en.md').read_text(encoding='utf-8').strip()
          Path('/tmp/final.md').write_text(base + marker + '\n' + en + '\n', encoding='utf-8')
          PY
          gh release edit "$TAG" --notes-file /tmp/final.md
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/bilingual-release-notes.yml
          git commit -m 'Release notu geçici işini temizle' || exit 0
          git push || true

# trigger
